<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <div class="guide-card" id="guideCard">
      <div class="guide-title">입력 안내</div>
      <p class="guide-desc">아래 예시처럼 주소를 입력하고 <strong>저장</strong>하면, 새 탭이 그 주소로 열려요.</p>

      <div class="example-groups">
        <div class="group">
          <span class="group-badge">도메인</span>
          <div class="group-list">
            <code>linkhub.nbyte.xyz</code>
            <code>google.com</code>
          </div>
        </div>

        <div class="group">
          <span class="group-badge">전체주소</span>
          <div class="group-list">
            <code>https://linkhub.nbyte.xyz</code>
            <code>https://google.com</code>
          </div>
        </div>

        <div class="group">
          <span class="group-badge">IP</span>
          <div class="group-list">
            <code>192.168.0.1</code>
            <code>http://192.168.0.1</code>
          </div>
        </div>
      </div>
    </div>

    <main class="card" id="card">
      <img src="logo.png" class="logo" />
      <h1 class="brand">Custom New Tab</h1>

      <div id="formWrap">
        <p class="desc">새 탭을 열면 설정한 주소로 바로 이동합니다.</p>
        <input id="url" placeholder="example.com 또는 192.168.0.1" />
        <button class="primary" id="save">저장</button>
      </div>

      <div id="statusWrap" class="status" style="display:none;"></div>
    </main>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
